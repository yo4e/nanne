name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - name: Run local Worker integration test
        run: |
          npx wrangler dev --local --port 8787 > /tmp/nanne-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/nanne-wrangler.log
            exit 1
          fi

          node test/e2e.mjs
